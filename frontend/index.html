<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrack-Onco | 肿瘤全过程治疗与慢病智能管理平台</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- ECharts 5 科学图表库 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>

  <!-- 顶部导航栏 -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="#" class="brand">
        <div class="brand-icon">🧬</div>
        <span>MedTrack-Onco</span>
      </a>

      <nav class="nav-links">
        <button class="nav-btn active" id="nav-btn-timeline" onclick="switchTab('timeline')">⏱️ 全病程时间轴</button>
        <button class="nav-btn" id="nav-btn-upload" onclick="switchTab('upload')">📸 单据智能识别</button>
        <button class="nav-btn" id="nav-btn-treatments" onclick="switchTab('treatments')">💊 专科治疗管理</button>
        <button class="nav-btn" id="nav-btn-charts" onclick="switchTab('charts')">📊 指标动态看板</button>
        <button class="nav-btn" id="nav-btn-report" onclick="switchTab('report')">📑 一键就诊报告</button>
      </nav>

      <div class="user-bar" id="user-bar">
        <!-- 登录后动态注入 -->
      </div>
    </div>
  </header>

  <!-- 主应用视图 -->
  <main class="container" id="main-app" style="margin-top: 20px; flex: 1;">
    
    <!-- 患者基准档案概览条 -->
    <div class="card" id="profile-summary-bar" style="background: linear-gradient(to right, #f8fafc, #f0fdf4); border-left: 4px solid var(--secondary);">
      <!-- 动态加载基准档案 -->
    </div>

    <!-- 选项卡 1: 全病程时间轴 -->
    <section class="tab-content" id="tab-timeline">
      <div class="card">
        <div class="card-title">
          <span>⏱️ 肿瘤全生命周期治疗全景时间轴</span>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" onclick="TimelineModule.setFilter('all')">全部</button>
            <button class="btn btn-secondary btn-sm" onclick="TimelineModule.setFilter('treatment')">手术/放化疗</button>
            <button class="btn btn-secondary btn-sm" onclick="TimelineModule.setFilter('imaging')">影像复查</button>
            <button class="btn btn-secondary btn-sm" onclick="TimelineModule.setFilter('lab')">化验检验</button>
            <button class="btn btn-secondary btn-sm" onclick="TimelineModule.setFilter('pathology')">病理基因</button>
          </div>
        </div>
        <div id="timeline-container"></div>
      </div>
    </section>

    <!-- 选项卡 2: AI 单据智能识别与上传 -->
    <section class="tab-content" id="tab-upload" style="display:none;">
      <div class="card">
        <div class="card-title">
          <span>📸 多模态 AI 智能医疗单据结构化识别</span>
        </div>

        <div style="display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap;">
          <div style="flex:1; min-width:200px;">
            <label class="form-label">选择单据类别：</label>
            <select class="form-select" id="upload-doc-type">
              <option value="lab">🧪 化验单 (血常规 / 肝肾功 / 肿瘤标志物全套)</option>
              <option value="imaging">🩻 影像检查报告 (胸部增强CT / 脑MRI / PET-CT / 超声)</option>
              <option value="pathology">🔬 病理诊断与分子突变报告 (活检 / 免疫组化 / NGS基因)</option>
              <option value="discharge">📋 出院小结 / 门诊化疗用药单 (既往治疗与周期记录)</option>
            </select>
          </div>
        </div>

        <div class="dropzone" onclick="document.getElementById('file-input').click()">
          <div class="dropzone-icon">📁</div>
          <p style="font-weight:600; color:#0369a1; font-size:1.05rem;">点击或拖拽手机拍照单据 / PDF 文件至此</p>
          <p style="font-size:0.85rem; color:#64748b; margin-top:6px;">支持 JPG、PNG、WEBP 及多页 PDF (最大支持 50MB)</p>
          <input type="file" id="file-input" style="display:none;" accept="image/*,.pdf" onchange="onFileSelected(event)">
        </div>

        <div id="upload-status" style="display:none; margin-top:16px;"></div>
        <div id="upload-preview" style="display:none; margin-top:16px;"></div>
      </div>
    </section>

    <!-- 选项卡 3: 专科治疗管理 -->
    <section class="tab-content" id="tab-treatments" style="display:none;">
      <div class="card">
        <div class="card-title">
          <span>💊 肿瘤专科治疗历程全要素登记 (手术 / 放疗 / 靶向化疗)</span>
        </div>
        <div id="treatments-list-container"></div>
      </div>
    </section>

    <!-- 选项卡 4: 指标动态看板 (ECharts) -->
    <section class="tab-content" id="tab-charts" style="display:none;">
      <div class="grid-2">
        <div class="card">
          <div id="chart-tumor-markers" style="height:360px;"></div>
        </div>
        <div class="card">
          <div id="chart-safety-markers" style="height:360px;"></div>
        </div>
      </div>
      <div class="card">
        <div id="chart-chronic-markers" style="height:300px;"></div>
      </div>
    </section>

    <!-- 选项卡 5: 一键就诊报告与外链分享 -->
    <section class="tab-content" id="tab-report" style="display:none;">
      <div id="report-container"></div>
    </section>

  </main>

  <!-- 模态弹窗 1: 用户登录与注册 -->
  <div id="auth-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:100; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
    <div class="card" style="width:100%; max-width:400px; margin:20px; box-shadow:var(--shadow-lg);">
      <div style="text-align:center; margin-bottom:18px;">
        <div style="font-size:36px; margin-bottom:8px;">🧬</div>
        <h2 style="font-size:1.3rem; font-weight:800; color:#0f172a;">MedTrack-Onco</h2>
        <p style="font-size:0.88rem; color:#64748b;">肿瘤全流程治疗与慢病智能管理系统</p>
      </div>

      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" id="auth-username" class="form-input" placeholder="输入用户名">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" id="auth-password" class="form-input" placeholder="输入密码">
      </div>
      <div id="auth-tip" style="font-size:0.85rem; color:#ef4444; margin-bottom:12px; min-height:20px;"></div>

      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" style="flex:1;" onclick="handleLogin()">登录</button>
        <button class="btn btn-secondary" style="flex:1;" onclick="handleRegister()">注册新账号</button>
      </div>
    </div>
  </div>

  <!-- 模态弹窗 2: 编辑肿瘤档案 -->
  <div id="profile-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:100; align-items:center; justify-content:center; overflow-y:auto; padding:20px 0;">
    <div class="card" style="width:100%; max-width:640px; margin:auto; box-shadow:var(--shadow-lg);">
      <div class="card-title">
        <span>✏️ 编辑肿瘤与慢病基准档案</span>
        <button class="btn btn-secondary btn-sm" onclick="closeProfileModal()">✕</button>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">患者姓名/昵称</label>
          <input type="text" id="prof-name" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">原发部位 (如：肺、胃、结直肠)</label>
          <input type="text" id="prof-site" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">病理分型 (如：浸润性腺癌)</label>
          <input type="text" id="prof-type" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">确诊时间 (YYYY-MM-DD)</label>
          <input type="date" id="prof-date" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">初诊分期 (如：cT2N2M0 IIIA期)</label>
          <input type="text" id="prof-staging" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">当前阶段 (如：维持治疗/辅助治疗)</label>
          <input type="text" id="prof-cur-staging" class="form-input">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">驱动基因与分子靶点 (JSON 格式)</label>
        <textarea id="prof-markers" class="form-textarea" rows="2" placeholder='{"EGFR": "19-del", "PD-L1": "TPS 60%"}'></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">合并慢性病 (JSON 数组)</label>
        <textarea id="prof-comorbidities" class="form-textarea" rows="2" placeholder='["原发性高血压", "2型糖尿病"]'></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
        <button class="btn btn-secondary" onclick="closeProfileModal()">取消</button>
        <button class="btn btn-primary" onclick="saveProfile()">保存档案</button>
      </div>
    </div>
  </div>

  <!-- 模态弹窗 3: 生成分享链接 -->
  <div id="share-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:100; align-items:center; justify-content:center;">
    <div class="card" style="width:100%; max-width:480px; margin:20px; box-shadow:var(--shadow-lg);">
      <div class="card-title">
        <span>🔗 生成医生/专家专属安全分享链接</span>
        <button class="btn btn-secondary btn-sm" onclick="closeShareModal()">✕</button>
      </div>
      <p style="font-size:0.88rem; color:#64748b; margin-bottom:12px;">生成仅供医生查阅的只读就诊总结外链，方便微信发送或扫码面诊：</p>
      
      <div class="form-group">
        <label class="form-label">链接有效期：</label>
        <select class="form-select" id="share-days">
          <option value="3">3 天</option>
          <option value="7" selected>7 天 (推荐门诊周期)</option>
          <option value="14">14 天</option>
          <option value="30">30 天</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">可选访问提取码 (留空则免密码)：</label>
        <input type="text" id="share-pin" class="form-input" placeholder="如设置 4 位密码，例如 8888" maxlength="8">
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="generateShareLink()">立即生成加密链接</button>
      <div id="share-result-box" style="display:none;"></div>
    </div>
  </div>

  <!-- 模态弹窗 4: 新增手术记录 -->
  <div id="surgery-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:100; align-items:center; justify-content:center; overflow-y:auto; padding:20px 0;">
    <div class="card" style="width:100%; max-width:560px; margin:auto;">
      <div class="card-title">
        <span>🔪 记录外科手术</span>
        <button class="btn btn-secondary btn-sm" onclick="closeAddSurgeryModal()">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">手术术式名称</label>
        <input type="text" id="surg-name" class="form-input" placeholder="如：胸腔镜右下肺叶切除+淋巴结清扫">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">手术日期</label>
          <input type="date" id="surg-date" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">切缘状态</label>
          <select class="form-select" id="surg-margins">
            <option value="R0">R0 (镜下切缘阴性/根治切除)</option>
            <option value="R1">R1 (镜下切缘阳性)</option>
            <option value="R2">R2 (肉眼可见残留)</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">淋巴结转移/清扫数</label>
          <input type="text" id="surg-lymph" class="form-input" placeholder="如：1/18">
        </div>
        <div class="form-group">
          <label class="form-label">医院与主刀医生</label>
          <input type="text" id="surg-hospital" class="form-input" placeholder="如：肿瘤医院 某教授">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">术后病理核心摘要</label>
        <textarea id="surg-pathology" class="form-textarea" rows="2" placeholder="切除标本病理诊断要点"></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-secondary" onclick="closeAddSurgeryModal()">取消</button>
        <button class="btn btn-primary" onclick="submitAddSurgery()">保存手术记录</button>
      </div>
    </div>
  </div>

  <!-- 模态弹窗 5: 新增放疗记录 -->
  <div id="radio-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:100; align-items:center; justify-content:center;">
    <div class="card" style="width:100%; max-width:560px; margin:auto;">
      <div class="card-title">
        <span>⚡ 记录放射治疗</span>
        <button class="btn btn-secondary btn-sm" onclick="closeAddRadioModal()">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">照射部位 / 靶区</label>
        <input type="text" id="radio-site" class="form-input" placeholder="如：纵隔引流区 / 颅脑转移灶">
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label class="form-label">放疗技术</label>
          <input type="text" id="radio-tech" class="form-input" placeholder="IMRT / SBRT / 质子">
        </div>
        <div class="form-group">
          <label class="form-label">总剂量</label>
          <input type="text" id="radio-dose" class="form-input" placeholder="如：60 Gy">
        </div>
        <div class="form-group">
          <label class="form-label">分割次数</label>
          <input type="text" id="radio-frac" class="form-input" placeholder="如：30 F">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">开始日期</label>
          <input type="date" id="radio-start" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">结束日期 (若已完成)</label>
          <input type="date" id="radio-end" class="form-input">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">放射性毒副反应</label>
        <input type="text" id="radio-tox" class="form-input" placeholder="如：轻微放射性食管炎、皮肤红斑">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-secondary" onclick="closeAddRadioModal()">取消</button>
        <button class="btn btn-primary" onclick="submitAddRadio()">保存放疗记录</button>
      </div>
    </div>
  </div>

  <!-- 模态弹窗 6: 新增治疗用药周期 -->
  <div id="therapy-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:100; align-items:center; justify-content:center;">
    <div class="card" style="width:100%; max-width:560px; margin:auto;">
      <div class="card-title">
        <span>💊 登记化疗 / 靶向 / 免疫治疗周期</span>
        <button class="btn btn-secondary btn-sm" onclick="closeAddTherapyModal()">✕</button>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">治疗阶段/线数</label>
          <select class="form-select" id="ther-line">
            <option value="术后辅助治疗">术后辅助治疗</option>
            <option value="术前新辅助">术前新辅助</option>
            <option value="一线治疗" selected>一线治疗</option>
            <option value="二线治疗">二线治疗</option>
            <option value="维持治疗">维持治疗</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">疗法类别</label>
          <select class="form-select" id="ther-type">
            <option value="靶向治疗">靶向治疗</option>
            <option value="化疗">化疗</option>
            <option value="免疫治疗">免疫治疗</option>
            <option value="化疗联合免疫">化疗联合免疫</option>
            <option value="内分泌治疗">内分泌治疗</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">方案名称</label>
          <input type="text" id="ther-regimen" class="form-input" placeholder="如：奥希替尼 80mg 或 培美曲塞+卡铂">
        </div>
        <div class="form-group">
          <label class="form-label">周期轮次</label>
          <input type="number" id="ther-cycle" class="form-input" value="1" min="1">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">本周期开始日期</label>
          <input type="date" id="ther-start" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">结束日期</label>
          <input type="date" id="ther-end" class="form-input">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">不良反应 (CTCAE分级)</label>
        <input type="text" id="ther-adverse" class="form-input" placeholder="如：白细胞降低I度、恶心I度">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-secondary" onclick="closeAddTherapyModal()">取消</button>
        <button class="btn btn-primary" onclick="submitAddTherapy()">保存周期记录</button>
      </div>
    </div>
  </div>

  <!-- 引入逻辑脚本 -->
  <script src="js/api.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
