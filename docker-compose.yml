version: '3.8'

services:
  # 1. MedTrack-Onco 肿瘤全生命周期与慢病智能管理平台 (一体化容器: 前端Web + 后端API + AI智能解析)
  medtrack:
    image: ghcr.io/befantasy/medtrack:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medtrack
    restart: always
    ports:
      - "${PORT:-6688}:8000"  # 宿主机访问端口，默认 6688
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-meduser}:${POSTGRES_PASSWORD:-med_secure_password_2026}@med-postgres:5432/${POSTGRES_DB:-medtrack_db}
      - JWT_SECRET=${JWT_SECRET:-medtrack-super-secret-key-2026}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123456}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - AI_MODEL=${AI_MODEL:-gemini-2.0-flash}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      med-postgres:
        condition: service_healthy
    networks:
      - medtrack-net

  # 2. 结构化数据库 (PostgreSQL 15)
  med-postgres:
    image: postgres:15-alpine
    container_name: med_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-med_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-medtrack_db}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meduser} -d ${POSTGRES_DB:-medtrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medtrack-net

networks:
  medtrack-net:
    name: medtrack-net
    driver: bridge
